name: Android APK (personal build)

# 手動觸發：Actions 頁 → 選這個 workflow → Run workflow
# 編譯 v1.2.1 原始碼，用臨時產生的金鑰簽名，產出 arm64 APK（絕大多數手機）。
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Minireel/HGhub
          ref: 5f88442961ad9cdac50af4421cf76b3ac06d64e2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 準備 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 編譯 APK（arm64）
        run: pnpm tauri android build --apk --target aarch64

      - name: 簽名（臨時金鑰，僅供自用）
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/personal.keystore"
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$KS" -alias hg -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=HGhub personal build"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias hg \
              --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
              --v4-signing-enabled false \
              --out "artifacts/HGhub_1.2.1_arm64.apk" "$f"
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::沒有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-apk
          path: artifacts/*.apk
          if-no-files-found: error
